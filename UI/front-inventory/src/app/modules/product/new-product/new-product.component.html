<h2 mat-dialog-title>{{estadoFormulario}}</h2>
<mat-dialog-content>
  <form [formGroup]="productForm">
    <div class="product-container">
      <mat-form-field>
        <mat-label>Nome</mat-label>
        <input matInput formControlName="name" required/>
         <mat-error  *ngIf="productForm.get('name')?.hasError('required')">
          O nome é obrigatório.
        </mat-error>
         <mat-error *ngIf="productForm.get('name')?.hasError('minlength')">
          O nome deve ter no mínimo 5 caracteres.
        </mat-error>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Preço</mat-label>
        <input matInput type="number" formControlName="price" required/>
        <mat-error *ngIf="productForm.get('price')?.hasError('required')">
          Preço é obrigatório.
        </mat-error>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Quantidade</mat-label>
        <input matInput type="number" formControlName="account" required/>
        <mat-error *ngIf="productForm.get('account')?.hasError('required')">
          Quantidade é obrigatório.
        </mat-error>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Categoria</mat-label>
        <mat-select formControlName="category" required>
          <mat-option *ngFor="let cat of categories" [value]="cat.id">
            {{cat.name}}
          </mat-option>
        </mat-select>
        <mat-error *ngIf="productForm.get('category')?.hasError('required')">
          A categoria é obrigatória.
        </mat-error>
      </mat-form-field>

      <div>
      <mat-label>Foto:</mat-label>
         <!--  <label for="file-upload" class="subir">Upload arquivo</label>
        <input type="file"
               id="file-upload"
               accept="image/png image/jpeg"
               class="input-file"
               (change)="onfileChange($event)"
               formControlName="picture"/> -->

       <button mat-raised-button color="primary" (click)="fileInput.click()">
       <mat-icon>cloud_upload</mat-icon>
        Escolher Arquivo
       </button>
        {{nameImg}}
      <input hidden type="file"
             #fileInput formControlName="picture"
             (change)="onfileChange($event)">
        <mat-error class="img-erro" *ngIf="!selectedFile">
          A imagem é obrigatória.
        </mat-error>
      </div>
    </div>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="center">
     <button mat-raised-button color="primary" (click)="onSave()" [disabled]="productForm.invalid || !selectedFile">
        <mat-icon>save</mat-icon>Salvar
      </button>
      <button mat-raised-button (click)="onCancel()">
        <mat-icon>cancel</mat-icon>Cancelar
      </button>
</mat-dialog-actions>
