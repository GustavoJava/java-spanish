<mat-card>
  <h2 class="alinear">Lista de Produtos</h2>
  <mat-card-header>
    <div>
      <mat-form-field hintLabel="buscar Produtos" appearance="fill">
          <mat-label>Buscar Produto</mat-label>
           <!-- <input matInput #input (keyup)="buscar(input.value)"> -->
          <input matInput #input>
      </mat-form-field>
    </div>
  </mat-card-header>
  <mat-card-header>
    <div class="right">
      <ul>
        <li>
          <button  mat-raised-button color="primary" (click)="openProductDialog()">
            Adicionar produto
            <mat-icon>add</mat-icon>
          </button>
        </li>
      </ul>
    </div>

  </mat-card-header>

  <div mat-card-image></div>

  <mat-card-content>
    <table mat-table [dataSource]="dataSource" >

      <!--Id-->
      <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>Nº</th>
          <td mat-cell *matCellDef="let element">{{element.id}}</td>
      </ng-container>

      <!--Name-->
      <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let element">{{element.name}}</td>
      </ng-container>

       <!--Price-->
      <ng-container matColumnDef="price">
          <th mat-header-cell *matHeaderCellDef>Price</th>
          <td mat-cell *matCellDef="let element">{{element.price}}</td>
      </ng-container>

        <!--Account-->
      <ng-container matColumnDef="account">
          <th mat-header-cell *matHeaderCellDef>Quantidad</th>
          <td mat-cell *matCellDef="let element">{{element.account}}</td>
      </ng-container>

      <!--Category-->
      <ng-container matColumnDef="category">
          <th mat-header-cell *matHeaderCellDef>Categoria</th>
          <td mat-cell *matCellDef="let element">{{element.category}}</td>
      </ng-container>

       <!--Picture-->
      <ng-container matColumnDef="picture">
          <th mat-header-cell *matHeaderCellDef>Foto</th>
          <td mat-cell *matCellDef="let element">
            <img [src]="element.picture" alt="imagem" width="50" height="50">
          </td>
      </ng-container>

         <!-- Actions -->
      <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let element;let i = index">
              <button mat-icon-button color="primary">
                  <mat-icon aria-label="Edit">edit</mat-icon>
              </button>
              <button mat-icon-button color="accent">
                  <mat-icon aria-label="Delete">delete</mat-icon>
              </button>
          </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayColumns "></tr>

    </table>

   <mat-paginator [pageSizeOptions]="[5, 10, 20]"
                  showFirstLastButtons>
  </mat-paginator>
  </mat-card-content>

  </mat-card>
