<mat-card>
  <h2 class="alinear">Lista de Categorias</h2>
  <mat-card-header>
    <div>
      <mat-form-field hintLabel="buscar Categorias" appearance="fill">
          <mat-label>Buscar Categorias</mat-label>
           <!-- <input matInput #input (keyup)="buscar(input.value)"> -->
          <input matInput #input (keyup)="applyFilter($event)">
      </mat-form-field>
    </div>
  </mat-card-header>
  <mat-card-header>
    <div class="right">
      <ul>
        <li>
          <button  mat-raised-button color="primary" (click)="openCategoryDialog()">
            Adicionar categoria
            <mat-icon>add</mat-icon>
          </button>
        </li>
      </ul>
    </div>

  </mat-card-header>

  <div mat-card-image></div>

  <mat-card-content>
    <table mat-table [dataSource]="dataSource" >

      <!--Id-->
      <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>Nº</th>
          <td mat-cell *matCellDef="let element">{{element.id}}</td>
      </ng-container>

      <!--Name-->
      <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let element">{{element.name}}</td>
      </ng-container>

       <!--Description-->
      <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>Description</th>
          <td mat-cell *matCellDef="let element">{{element.description}}</td>
      </ng-container>

         <!-- Actions -->
      <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let element;let i = index">
              <button mat-icon-button color="primary" (click)="edit(element)">
                  <mat-icon aria-label="Edit">edit</mat-icon>
              </button>
              <button mat-icon-button color="accent" (click)="eliminar(element)">
                  <mat-icon aria-label="Delete">delete</mat-icon>
              </button>
          </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayColumns "></tr>

    </table>

   <mat-paginator [pageSizeOptions]="[5, 10, 20]"
                  showFirstLastButtons>
  </mat-paginator>
  </mat-card-content>

  </mat-card>
